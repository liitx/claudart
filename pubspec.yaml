name: claudart
description: A Dart CLI for managing structured debug and suggestion sessions via local markdown workspaces. Works with any editor that supports slash commands.
version: 2.0.0
repository: https://github.com/liitx/claudart
issue_tracker: https://github.com/liitx/claudart/issues

environment:
  sdk: '>=3.0.0 <5.0.0'

executables:
  claudart: claudart

# Dependency ledger — record why each one is here, not just what. Kept
# deliberately minimal: claudart's only 2 runtime deps are args+path, a
# constraint already load-bearing elsewhere in this codebase (see
# git_utils.dart's dartrix-promotion tradeoff) and worth defending
# explicitly instead of letting it erode one small addition at a time.
dependencies:
  # CLI argument parsing for every claudart subcommand.
  args: ^2.5.0
  # Cross-platform path joining/resolution — used everywhere a workspace
  # or project path is built, instead of hand-rolled string concatenation.
  path: ^1.8.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.0
  # Runtime mocks/fakes for ProcessRunner, FileIO, etc. in tests.
  mocktail: ^1.0.5
  # Dev-only (not `dependencies`): the matrix/coverage testing framework
  # and paradigm law — available to test/ and custom_lint's own rule
  # definitions, deliberately NOT to lib/, so claudart's production
  # runtime footprint stays at just args+path. Promoting this to a real
  # dependency (e.g. to share a production enum like FaultClass) is a
  # real, visible cost -- a decision, not a default.
  dartrix:
    git:
      url: https://github.com/liitx/dartrix.git
  custom_lint: ^0.8.1
  # This repo's own hand-ported custom_lint rules (bare_string_for_enum,
  # enum_values_loop_in_single_test, ungrouped_identical_switch_cases).
  claudart_lints:
    path: tool/claudart_lints
  # Mutation testing -- catches tests that pass but verify nothing real
  # (coverage alone can't; confirmed empirically against the ProjectConfig
  # dead-field case). Added as-is rather than reimplemented: its own
  # dependency footprint is just args+path+xml, no net-new runtime cost,
  # and reimplementing a working tool would itself be the redundancy this
  # project exists to avoid. Phase 1: use it as-is to get real mutation
  # coverage working. Phase 2, once we know exactly which of its features
  # we actually exercise: fold just that subset into dartrix natively and
  # drop this dependency -- not decided or started yet.
  mutation_test: ^1.8.0
