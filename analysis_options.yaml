include: package:lints/recommended.yaml

analyzer:
  plugins:
    - custom_lint

  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  errors:
    # Treat missing enum cases as errors — exhaustive switches are required
    missing_enum_constant_in_switch: error
    # Treat dead code as a warning — unused enum branches are a smell
    dead_code: warning
    # Bare-string switches — see custom_lint block below for the rule itself
    bare_string_for_enum: error
    # Enum-values loop inside a single test() — see custom_lint block below
    enum_values_loop_in_single_test: error
    # Repeated identical switch-expression bodies not grouped with || —
    # see custom_lint block below
    ungrouped_identical_switch_cases: error
    # confirmFn/askFn: (_) => true with no promptFn fallback — see
    # custom_lint block below
    unconditional_confirm_requires_prompt_fn: error

custom_lint:
  rules:
    - bare_string_for_enum
    - enum_values_loop_in_single_test
    - ungrouped_identical_switch_cases
    - unconditional_confirm_requires_prompt_fn

linter:
  rules:
    # --- Type safety ---
    avoid_dynamic_calls: true
    prefer_void_to_null: true

    # --- Enum-first / no bare strings ---
    # Enforced by the custom_lint plugin (tool/claudart_lints) — see
    # analyzer.plugins and custom_lint above. Exhaustive switch on enums,
    # once one exists, is separately enforced by missing_enum_constant_in_switch.

    # --- Immutability ---
    prefer_final_fields: true
    prefer_final_locals: true
    prefer_const_constructors: true
    prefer_const_declarations: true

    # --- Code clarity ---
    avoid_catches_without_on_clauses: true
    cancel_subscriptions: true
    close_sinks: true
    use_string_buffers: true
    prefer_single_quotes: true

    # --- Performance ---
    avoid_slow_async_io: true
    prefer_is_empty: true
    prefer_is_not_empty: true
